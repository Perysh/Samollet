<script>
(function(){
  var el = document.getElementById('plane');
  var cv = document.getElementById('fx');
  var ctx = cv.getContext('2d');
  var W, H, dpr;
  function resize(){
    dpr = window.devicePixelRatio || 1;
    W = innerWidth; H = innerHeight;
    cv.width = W*dpr; cv.height = H*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  resize(); addEventListener('resize', resize);

  function rand(a,b){ return a + Math.random()*(b-a); }
  function pw(){ return el.offsetWidth || 200; }
  function ph(){ return el.offsetHeight || pw()*0.577; }

  // точка вылета эффектов (печать и лента) в долях картинки
  var EX = 0.30, EY = 0.40;

  var x = W*0.5, y = H*0.5;
  var heading = rand(0, Math.PI*2);
  var speed = 150, turn = 0, targetTurn = 0, targetSpeed = 180;
  var nextChange = 0, flip = 1, t = 0, last = performance.now();
  var parts = [];
  var swirlPhase = 0;

  function spawn(px, py, back){
    var c = Math.random();
    var p = { x:px, y:py, life:0, max:rand(0.8,1.9) };
    var spread = rand(-30,30);
    p.vx = Math.cos(back)*rand(10,50) + rand(-25,25);
    p.vy = Math.sin(back)*rand(10,50) + rand(-25,25);
    if (c < 0.35){ p.type='star'; p.size=rand(3,7); p.col = Math.random()<0.5 ? '255,214,140' : '255,255,255'; p.spin=rand(-3,3); p.rot=rand(0,6.28); }
    else if (c < 0.8){ p.type='glow'; p.size=rand(2,5); p.col = Math.random()<0.5 ? '120,150,255' : '170,190,255'; }
    else { p.type='wisp'; p.size=rand(8,16); p.col='110,130,255'; p.max=rand(1.0,2.0); }
    parts.push(p);
  }

  function drawStar(p, a){
    var s = p.size*(0.6+0.4*Math.sin(p.life*14));
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
    var g = ctx.createRadialGradient(0,0,0,0,0,s*2.2);
    g.addColorStop(0,'rgba('+p.col+','+a+')'); g.addColorStop(1,'rgba('+p.col+',0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,s*2.2,0,6.283); ctx.fill();
    ctx.fillStyle='rgba('+p.col+','+Math.min(1,a*1.2)+')';
    ctx.beginPath();
    ctx.moveTo(0,-s*1.6); ctx.quadraticCurveTo(0,0,s*1.6,0); ctx.quadraticCurveTo(0,0,0,s*1.6);
    ctx.quadraticCurveTo(0,0,-s*1.6,0); ctx.quadraticCurveTo(0,0,0,-s*1.6); ctx.fill();
    ctx.restore();
  }
  function drawGlow(p, a, r){
    var g = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,r);
    g.addColorStop(0,'rgba('+p.col+','+a+')'); g.addColorStop(1,'rgba('+p.col+',0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(p.x,p.y,r,0,6.283); ctx.fill();
  }

  function frame(now){
    var dt = Math.min((now-last)/1000, 0.05); last = now; t += dt;

    // хаотичный полёт
    if (t > nextChange){
      nextChange = t + rand(0.4, 1.8);
      targetTurn = rand(-3.2, 3.2);
      if (Math.random() < 0.15) targetTurn *= 1.8;
      targetSpeed = rand(100, 340);
    }
    turn  += (targetTurn  - turn)  * Math.min(1, dt*3);
    speed += (targetSpeed - speed) * Math.min(1, dt*1.5);

    var m = pw()*0.6, push = 0;
    if (x < m || x > W-m || y < m || y > H-m){
      var want = Math.atan2(H/2-y, W/2-x);
      var d = Math.atan2(Math.sin(want-heading), Math.cos(want-heading));
      push = d*4;
    }
    heading += (turn + push) * dt;
    x += Math.cos(heading)*speed*dt;
    y += Math.sin(heading)*speed*dt + Math.sin(t*3.1)*12*dt;
    x = Math.max(-pw()*0.2, Math.min(W+pw()*0.2, x));
    y = Math.max(-ph()*0.2, Math.min(H+ph()*0.2, y));

    flip += ((Math.cos(heading) < 0 ? -1 : 1) - flip) * Math.min(1, dt*8);
    var bank = Math.sin(t*4.3)*4 + turn*4;
    var ang = heading + bank*Math.PI/180;

    var w = pw(), h = ph();
    el.style.transform = 'translate('+(x-w/2)+'px,'+(y-h/2)+'px) rotate('+(ang*180/Math.PI)+'deg) scaleY('+flip+')';

    // позиция хвоста в мировых координатах
    var lx = (EX-0.5)*w, ly = (EY-0.5)*h*flip;
    var tx = x + lx*Math.cos(ang) - ly*Math.sin(ang);
    var ty = y + lx*Math.sin(ang) + ly*Math.cos(ang);
    var back = ang + Math.PI;

    // эмиссия: искры + волнистая синяя лента
    var count = Math.round(dt*140 + Math.random());
    for (var i=0;i<count;i++) spawn(tx+rand(-6,6), ty+rand(-6,6), back);
    swirlPhase += dt*9;
    var off = Math.sin(swirlPhase)*14;
    var nx = -Math.sin(back), ny = Math.cos(back);
    parts.push({type:'glow', x:tx+nx*off, y:ty+ny*off, vx:Math.cos(back)*20, vy:Math.sin(back)*20,
                life:0, max:1.6, size:3.2, col:'110,140,255'});

    // рисуем
    ctx.clearRect(0,0,W,H);
    for (var k=parts.length-1; k>=0; k--){
      var p = parts[k];
      p.life += dt;
      if (p.life >= p.max){ parts.splice(k,1); continue; }
      p.x += p.vx*dt; p.y += p.vy*dt;
      p.vx *= (1-dt*0.8); p.vy *= (1-dt*0.8);
      if (p.rot !== undefined) p.rot += (p.spin||0)*dt;
      var a = 1 - p.life/p.max; a = a*a;
      if (p.type==='star') drawStar(p, a);
      else if (p.type==='glow') drawGlow(p, 0.9*a, p.size*2.5);
      else drawGlow(p, 0.35*a, p.size*(1+p.life));
    }
    if (parts.length > 900) parts.splice(0, parts.length-900);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
